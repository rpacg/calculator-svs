name: Merge Changelog

on:
  push:
    branches: [ main ]
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run merge_changelog script
        run: |
          python scripts/merge_changelog.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add CHANGELOG.md
            git commit -m "chore(changelog): regenerate archived logs via workflow"
            git push
          else
            echo "No changes to commit"
          fi

      - name: Notify Discord (optional)
        if: ${{ secrets.DISCORD_WEBHOOK_URL != '' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            PAYLOAD=$(jq -n --arg repo "$REPO" --arg ref "$REF" --arg sha "$SHA" --arg actor "$ACTOR" --arg url "$RUN_URL" '{username: "changelog-bot", embeds: [{ title: "CHANGELOG updated", description: ("Repository: " + $repo + "\nRef: " + $ref + "\nCommit: " + $sha + "\nActor: " + $actor), url: $url, color: 3066993 }] }')
            curl -s -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"
          else
            echo "DISCORD_WEBHOOK_URL not set, skipping"
          fi
